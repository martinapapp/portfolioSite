<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="#home">Home</a>
    <a href="#projects">Projects</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>

  <section id="home">

  <section id="projects">

      <button class="carousel-btn next" id="carousel-next">&#8250;</button>
    </div>

    <div class="carousel-dots" id="carousel-dots"></div>

    <a href="https://github.com/martinapapp?tab=repositories" target="_blank" class="more-link">More</a>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <h2>About</h2>
    <p>Tell your story here.</p>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <h2 class="contact-header">Contact</h2>
    <div class="contact-grid" id="contact-grid"></div>
  </section>

  <script src="index.js" type="module"></script>

</html>
